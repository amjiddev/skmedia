openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form
  - name: admin
    description: Admin authentication and lead management
  - name: team
    description: Public team profiles
  - name: member-auth
    description: Member registration and authentication
paths:
  /home-content:
    get:
      operationId: getHomeContent
      tags: [home-content]
      summary: Get public homepage content
      responses:
        "200":
          description: Editable homepage sections and chart data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePageContent"
  /admin/home-content:
    get:
      operationId: getAdminHomeContent
      tags: [admin]
      summary: Get homepage content for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Current homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePageContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateHomeContent
      tags: [admin]
      summary: Update homepage content
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePageContent"
      responses:
        "200":
          description: Updated homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePageContent"
        "400":
          description: Invalid homepage content
        "401":
          description: Admin authentication required
  /team:
    get:
      operationId: getTeam
      tags: [team]
      summary: Get published team members
      responses:
        "200":
          description: Published team profiles in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /admin/team:
    get:
      operationId: getAdminTeam
      tags: [admin]
      summary: Get all team profiles for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: All team profiles, including drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "401":
          description: Admin authentication required
    post:
      operationId: createTeamMember
      tags: [admin]
      summary: Create a team profile
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Team profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid team member details
        "401":
          description: Admin authentication required
  /about-content:
    get:
      operationId: getAboutContent
      tags: [about-content]
      summary: Get public About page content
      responses:
        "200":
          description: Header, story, and mission section content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutContent"
  /contact-content:
    get:
      operationId: getContactContent
      tags: [contact]
      summary: Get public Contact page content
      responses:
        "200":
          description: Hero, contact details, and form section content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPageContent"
  /admin/contact-content:
    get:
      operationId: getAdminContactContent
      tags: [admin]
      summary: Get Contact page content for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Current Contact page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPageContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateContactContent
      tags: [admin]
      summary: Update Contact page content
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPageContent"
      responses:
        "200":
          description: Updated Contact page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPageContent"
        "400":
          description: Invalid Contact page content
        "401":
          description: Admin authentication required
  /services-content:
    get:
      operationId: getServicesContent
      tags: [services-content]
      summary: Get public Services page content
      responses:
        "200":
          description: Hero, service cards, and process section content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesPageContent"
  /faqs:
    get:
      operationId: getFaqs
      tags: [faq]
      summary: Get published FAQs
      responses:
        "200":
          description: Published questions and answers in display order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FAQPageContent"
  /community-plans:
    get:
      operationId: getCommunityPlans
      tags: [community]
      summary: Get public community membership plans
      responses:
        "200":
          description: Free and premium community plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPlansContent"
  /admin/community-plans:
    get:
      operationId: getAdminCommunityPlans
      tags: [admin]
      summary: Get community plans for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Current free and premium plan content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPlansContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateCommunityPlans
      tags: [admin]
      summary: Update community plans
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPlansContent"
      responses:
        "200":
          description: Updated community plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPlansContent"
        "400":
          description: Invalid community plan content
        "401":
          description: Admin authentication required
  /admin/faqs:
    get:
      operationId: getAdminFaqs
      tags: [admin]
      summary: Get FAQs for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: All FAQs, including unpublished drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FAQPageContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateAdminFaqs
      tags: [admin]
      summary: Replace FAQ content
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FAQPageContent"
      responses:
        "200":
          description: Updated FAQ content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FAQPageContent"
        "400":
          description: Invalid FAQ content
        "401":
          description: Admin authentication required
  /admin/services-content:
    get:
      operationId: getAdminServicesContent
      tags: [admin]
      summary: Get Services page content for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Current Services page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesPageContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateServicesContent
      tags: [admin]
      summary: Update Services page content
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicesPageContent"
      responses:
        "200":
          description: Updated Services page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesPageContent"
        "400":
          description: Invalid Services page content
        "401":
          description: Admin authentication required
  /admin/about-content:
    get:
      operationId: getAdminAboutContent
      tags: [admin]
      summary: Get About page content for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Current About page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutContent"
        "401":
          description: Admin authentication required
    put:
      operationId: updateAboutContent
      tags: [admin]
      summary: Update About page content
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutContent"
      responses:
        "200":
          description: Updated About page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutContent"
        "400":
          description: Invalid About page content
        "401":
          description: Admin authentication required
  /admin/team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [admin]
      summary: Update a team profile
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "200":
          description: Updated team profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid team member details
        "401":
          description: Admin authentication required
        "404":
          description: Team member not found
    delete:
      operationId: deleteTeamMember
      tags: [admin]
      summary: Delete a team profile
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Team profile deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          description: Admin authentication required
        "404":
          description: Team member not found
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: createContact
      tags: [contact]
      summary: Submit a contact request
      description: Validates and stores a lead from the public website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Invalid contact details
        "429":
          description: Too many requests
  /prompts:
    get:
      operationId: getPrompts
      tags: [prompts]
      summary: Get published prompt cards
      responses:
        "200":
          description: Published prompt cards, without prompt text
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptCard"
  /prompts/{slug}:
    get:
      operationId: getPromptBySlug
      tags: [prompts]
      summary: Get a published prompt by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published prompt details, including downloadable-file metadata when present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
        "404":
          description: Prompt not found
  /prompts/{slug}/download:
    get:
      operationId: downloadPromptFile
      tags: [prompts]
      summary: Download a published prompt attachment
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prompt attachment download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Prompt attachment is not available for this access level
        "404":
          description: Prompt or attachment not found
  /admin/prompts:
    get:
      operationId: getAdminPrompts
      tags: [admin]
      summary: Get all prompts for administration
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: All prompts, including drafts and prompt text
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
        "401":
          description: Admin authentication required
    post:
      operationId: createPrompt
      tags: [admin]
      summary: Create a prompt
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "201":
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "400":
          description: Invalid prompt details
        "401":
          description: Admin authentication required
        "409":
          description: Prompt slug already exists
  /admin/prompts/{id}:
    patch:
      operationId: updatePrompt
      tags: [admin]
      summary: Update a prompt
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "200":
          description: Updated prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "400":
          description: Invalid prompt details
        "401":
          description: Admin authentication required
        "404":
          description: Prompt not found
        "409":
          description: Prompt slug already exists
    delete:
      operationId: deletePrompt
      tags: [admin]
      summary: Delete a prompt
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prompt deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          description: Admin authentication required
        "404":
          description: Prompt not found
  /ideas:
    get:
      operationId: getSharedIdeas
      tags: [ideas]
      summary: Get approved shared creator ideas
      responses:
        "200":
          description: Shared ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedIdea"
    post:
      operationId: createSharedIdea
      tags: [ideas]
      summary: Add a shared creator idea
      description: Requires an authenticated member or admin session. Member submissions are pending until an admin approves them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedIdeaInput"
      responses:
        "201":
          description: Idea created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedIdea"
        "400":
          description: Invalid idea details
        "401":
          description: Authentication required
  /ideas/all:
    get:
      operationId: getAllSharedIdeas
      tags: [admin]
      summary: Get every shared idea for admin review
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: All ideas, including pending and rejected ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedIdea"
        "401":
          description: Admin authentication required
  /ideas/{id}:
    delete:
      operationId: deleteSharedIdea
      tags: [admin]
      summary: Delete a shared idea
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Idea deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          description: Admin authentication required
        "404":
          description: Idea not found
  /ideas/{id}/status:
    patch:
      operationId: updateSharedIdeaStatus
      tags: [admin]
      summary: Approve or reject a shared idea
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedIdeaStatusInput"
      responses:
        "200":
          description: Updated shared idea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedIdea"
        "401":
          description: Admin authentication required
        "404":
          description: Idea not found
  /auth/register:
    post:
      operationId: memberRegister
      tags: [member-auth]
      summary: Create a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRegisterInput"
      responses:
        "201":
          description: Account created; the member must sign in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "400":
          description: Invalid registration details
        "409":
          description: Email address is already registered
        "429":
          description: Too many registration attempts
  /auth/login:
    post:
      operationId: memberLogin
      tags: [member-auth]
      summary: Sign in to a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "400":
          description: Invalid sign-in details
        "401":
          description: Incorrect email or password
        "429":
          description: Too many sign-in attempts
  /auth/session:
    get:
      operationId: getMemberSession
      tags: [member-auth]
      summary: Check the current member session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
  /auth/logout:
    post:
      operationId: memberLogout
      tags: [member-auth]
      summary: End the current member session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid username or password
        "429":
          description: Too many login attempts
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/profile:
    patch:
      operationId: updateAdminProfile
      tags: [admin]
      summary: Update the current administrator's email address
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfileInput"
      responses:
        "200":
          description: Updated administrator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid email address
        "401":
          description: Admin authentication required
        "409":
          description: Email address is already assigned to another admin
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /admin/change-password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the current admin password
      description: Requires an authenticated admin session and the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAdminPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    const: true
        "400":
          description: Invalid request or current password is incorrect
        "401":
          description: Admin authentication required
  /contacts:
    get:
      operationId: getContacts
      tags: [admin]
      summary: Get all contact leads
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Contact leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "401":
          description: Admin authentication required
  /contacts/summary:
    get:
      operationId: getContactSummary
      tags: [admin]
      summary: Get contact lead counts
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Contact totals by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSummary"
        "401":
          description: Admin authentication required
  /contacts/{id}:
    patch:
      operationId: updateContactStatus
      tags: [admin]
      summary: Mark a contact lead as contacted or new
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactStatusInput"
      responses:
        "200":
          description: Updated contact lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          description: Admin authentication required
        "404":
          description: Contact lead not found
    delete:
      operationId: deleteContact
      tags: [admin]
      summary: Delete a contact lead
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted contact lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          description: Admin authentication required
        "404":
          description: Contact lead not found
components:
  schemas:
    HomeFeatureIcon:
      type: string
      enum: [users, shield, target, trend, youtube, facebook, tiktok, pin, video, sparkles]
    HomeChartMonth:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          minLength: 1
          maxLength: 16
        earnings:
          type: integer
          minimum: 0
          maximum: 1000000000
        bonus:
          type: integer
          minimum: 0
          maximum: 1000000000
      required: [month, earnings, bonus]
    HomeChartPlatform:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        amount:
          type: string
          minLength: 1
          maxLength: 40
      required: [name, amount]
    HomeFeatureCard:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 1000
        icon:
          $ref: "#/components/schemas/HomeFeatureIcon"
      required: [title, description, icon]
    HomeOpportunityStep:
      type: object
      additionalProperties: false
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 12
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 1000
      required: [number, title, description]
    HomeIconText:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
        icon:
          $ref: "#/components/schemas/HomeFeatureIcon"
      required: [text, icon]
    HomeValueCard:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
