openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form
  - name: admin
    description: Admin authentication and lead management
  - name: member-auth
    description: Member registration and authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: createContact
      tags: [contact]
      summary: Submit a contact request
      description: Validates and stores a lead from the public website.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact request saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Invalid contact details
        "429":
          description: Too many requests
  /ideas:
    get:
      operationId: getSharedIdeas
      tags: [ideas]
      summary: Get shared creator ideas
      responses:
        "200":
          description: Shared ideas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedIdea"
    post:
      operationId: createSharedIdea
      tags: [ideas]
      summary: Add a shared creator idea
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedIdeaInput"
      responses:
        "201":
          description: Idea created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedIdea"
        "400":
          description: Invalid idea details
        "401":
          description: Admin authentication required
  /auth/register:
    post:
      operationId: memberRegister
      tags: [member-auth]
      summary: Create a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRegisterInput"
      responses:
        "201":
          description: Account created; the member must sign in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "400":
          description: Invalid registration details
        "409":
          description: Email address is already registered
        "429":
          description: Too many registration attempts
  /auth/login:
    post:
      operationId: memberLogin
      tags: [member-auth]
      summary: Sign in to a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "400":
          description: Invalid sign-in details
        "401":
          description: Incorrect email or password
        "429":
          description: Too many sign-in attempts
  /auth/session:
    get:
      operationId: getMemberSession
      tags: [member-auth]
      summary: Check the current member session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
  /auth/logout:
    post:
      operationId: memberLogout
      tags: [member-auth]
      summary: End the current member session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in to the admin panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid username or password
        "429":
          description: Too many login attempts
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/profile:
    patch:
      operationId: updateAdminProfile
      tags: [admin]
      summary: Update the current administrator's email address
      description: Requires an authenticated admin session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfileInput"
      responses:
        "200":
          description: Updated administrator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid email address
        "401":
          description: Admin authentication required
        "409":
          description: Email address is already assigned to another admin
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /admin/change-password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the current admin password
      description: Requires an authenticated admin session and the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAdminPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    const: true
        "400":
          description: Invalid request or current password is incorrect
        "401":
          description: Admin authentication required
  /contacts:
    get:
      operationId: getContacts
      tags: [admin]
      summary: Get all contact leads
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Contact leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "401":
          description: Admin authentication required
  /contacts/summary:
    get:
      operationId: getContactSummary
      tags: [admin]
      summary: Get contact lead counts
      description: Requires an authenticated admin session.
      responses:
        "200":
          description: Contact totals by status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSummary"
        "401":
          description: Admin authentication required
  /contacts/{id}:
    patch:
      operationId: updateContactStatus
      tags: [admin]
      summary: Mark a contact lead as contacted or new
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactStatusInput"
      responses:
        "200":
          description: Updated contact lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "401":
          description: Admin authentication required
        "404":
          description: Contact lead not found
    delete:
      operationId: deleteContact
      tags: [admin]
      summary: Delete a contact lead
      description: Requires an authenticated admin session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted contact lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          description: Admin authentication required
        "404":
          description: Contact lead not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 32
        platform:
          type: string
          enum: [YouTube, Facebook, TikTok, Other]
        message:
          type: string
          maxLength: 2000
      required: [name, email, phone, platform]
    ContactSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        emailNotification:
          type: string
          enum: [sent, not_configured, failed]
      required: [id, message, emailNotification]
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        platform:
          type: string
          enum: [YouTube, Facebook, TikTok, Other]
        message:
          type: ["string", "null"]
        status:
          type: string
          enum: [new, contacted]
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, phone, platform, message, status, createdAt]
    SharedIdeaInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 4
          maxLength: 100
        category:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 10
          maxLength: 500
        tag:
          type: string
          minLength: 1
          maxLength: 80
      required: [title, category, description, tag]
    SharedIdea:
      allOf:
        - $ref: "#/components/schemas/SharedIdeaInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            postedBy:
              type: string
              minLength: 1
              maxLength: 100
          required: [id, createdAt, postedBy]
    AdminLoginInput:
      type: object
      additionalProperties: false
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
      required: [identifier, password]
    AdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
          format: email
      required: [authenticated, username, email]
    AdminProfileInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: ["string", "null"]
          format: email
          maxLength: 254
      required: [email]
    ChangeAdminPasswordInput:
      type: object
      additionalProperties: false
      properties:
        oldPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
      required: [oldPassword, newPassword]
    MemberRegisterInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 200
      required: [name, email, password]
    MemberLoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
      required: [email, password]
    MemberIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
      required: [id, name, email]
    MemberSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/MemberIdentity"
            - type: "null"
      required: [authenticated, user]
    ContactStatusInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [new, contacted]
      required: [status]
    ContactSummary:
      type: object
      properties:
        total:
          type: integer
        new:
          type: integer
        contacted:
          type: integer
      required: [total, new, contacted]
    ActionResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

